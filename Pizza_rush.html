<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Pizza Rush — Pizzeria Time-Management</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#241611;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   PIZZA RUSH — architecture per "Architecting Player Persistence"
   - Fixed timestep update loop (60Hz) decoupled from rendering
   - Object pooling for particles & floating text (zero GC churn)
   - localStorage persistence (tiny JSON, well under 5MB quota)
   - Core loop: speed + ingredient strategy + customer satisfaction
   - Retention: upgrades, daily goals, Pizza Pass meta-progression
   ============================================================ */

/* ---------- canvas & scaling ---------- */
const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const VW=480, VH=800;
let dpr=1, scaleF=1, offX=0, offY=0;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  const w=window.innerWidth,h=window.innerHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  scaleF=Math.min(w/VW,h/VH); offX=(w-VW*scaleF)/2; offY=(h-VH*scaleF)/2;
}
window.addEventListener('resize',resize); resize();

/* ---------- utils ---------- */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
 ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,6.2832);ctx.fill();}
function txt(s,x,y,size,col,align,weight){ctx.fillStyle=col||'#3a2a1e';
 ctx.font=(weight||800)+' '+(size||16)+'px "Trebuchet MS","Segoe UI",Verdana,sans-serif';
 ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function starPath(x,y,r,col,rot){ctx.fillStyle=col;ctx.beginPath();
 for(let i=0;i<10;i++){const a=(rot||0)-Math.PI/2+i*Math.PI/5,rd=i%2?r*0.45:r;
 ctx.lineTo(x+Math.cos(a)*rd,y+Math.sin(a)*rd);}ctx.closePath();ctx.fill();}
function heart(x,y,s,col){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=col;
 ctx.beginPath();ctx.moveTo(0,0.4);ctx.bezierCurveTo(-0.95,-0.35,-0.35,-1.05,0,-0.5);
 ctx.bezierCurveTo(0.35,-1.05,0.95,-0.35,0,0.4);ctx.fill();ctx.restore();}
function coinDraw(x,y,r){ctx.fillStyle='#c78a21';circle(x,y,r);
 ctx.fillStyle='#f5b93c';circle(x,y-r*0.12,r*0.9);ctx.fillStyle='#ffd968';circle(x,y-r*0.12,r*0.55);}

/* ---------- audio (WebAudio synth, gesture-gated) ---------- */
let actx=null;
function initAudio(){ if(actx)return;
 try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} }
function tone(f,d,type,v,f2,dl){ if(!actx||S.muted)return;
 const t=actx.currentTime+(dl||0),o=actx.createOscillator(),g=actx.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f,t);
 if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(f2,1),t+d);
 g.gain.setValueAtTime(v||0.14,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d+0.05);}
function sfx(n){ if(!actx||S.muted)return; switch(n){
 case 'tap':tone(520,0.05,'triangle',0.07);break;
 case 'pop':tone(300,0.09,'sine',0.16,560);break;
 case 'error':tone(150,0.14,'square',0.07);break;
 case 'oven':tone(200,0.28,'sawtooth',0.05,80);break;
 case 'ding':tone(880,0.14,'sine',0.14);tone(1318,0.3,'sine',0.13,null,0.09);break;
 case 'serve':tone(523,0.09,'triangle',0.13);tone(659,0.09,'triangle',0.13,null,0.07);tone(784,0.16,'triangle',0.13,null,0.14);break;
 case 'perfect':tone(523,0.08,'triangle',0.14);tone(659,0.08,'triangle',0.14,null,0.06);tone(784,0.08,'triangle',0.14,null,0.12);tone(1046,0.25,'triangle',0.15,null,0.18);break;
 case 'angry':tone(220,0.3,'sawtooth',0.09,110);break;
 case 'coin':tone(1046,0.07,'square',0.06,1568);break;
 case 'burn':tone(120,0.35,'sawtooth',0.09,60);break;
 case 'buy':tone(659,0.08,'triangle',0.13);tone(880,0.15,'triangle',0.13,null,0.08);break;
 case 'tier':tone(523,0.1,'triangle',0.14);tone(659,0.1,'triangle',0.14,null,0.09);tone(784,0.1,'triangle',0.14,null,0.18);tone(1046,0.3,'triangle',0.15,null,0.27);break;
 case 'star':tone(784,0.12,'triangle',0.14,1046);break;
}}

/* ---------- game data ---------- */
const TOPPINGS=[
 {id:'pep',  name:'Pepperoni',   day:1},
 {id:'mush', name:'Mushroom',    day:1},
 {id:'pepr', name:'Green Pepper',day:2},
 {id:'oliv', name:'Olives',      day:3},
 {id:'onion',name:'Red Onion',   day:4},
 {id:'basil',name:'Basil',       day:5},
 {id:'pinea',name:'Pineapple',   day:6},
];
const TOPNAME={}; TOPPINGS.forEach(t=>TOPNAME[t.id]=t.name);
const UPG=[
 {id:'oven',  icon:'🔥',name:'Fast Oven',    max:5,cost:l=>Math.round(60*Math.pow(1.9,l)), desc:'Pizzas bake faster'},
 {id:'ovens', icon:'♨️',name:'Extra Oven',   max:2,cost:l=>l===0?150:520,                  desc:'+1 oven slot'},
 {id:'prep',  icon:'🧑‍🍳',name:'Prep Station',max:2,cost:l=>l===0?130:430,                 desc:'+1 prep board'},
 {id:'pantry',icon:'📦',name:'Smart Pantry', max:5,cost:l=>Math.round(50*Math.pow(1.8,l)), desc:'+2 bin capacity, faster restock'},
 {id:'decor', icon:'🪴',name:'Cozy Decor',   max:5,cost:l=>Math.round(70*Math.pow(1.85,l)),desc:'Customers wait longer'},
 {id:'tips',  icon:'💰',name:'Tip Jar',      max:5,cost:l=>Math.round(80*Math.pow(1.9,l)), desc:'Bigger tips per serve'},
];
function upgDetail(u,l){switch(u.id){
 case 'oven':return (7.5-l*0.8).toFixed(1)+'s → '+(7.5-(l+1)*0.8).toFixed(1)+'s cook';
 case 'ovens':return (1+l)+' → '+(2+l)+' ovens';
 case 'prep':return (1+l)+' → '+(2+l)+' boards';
 case 'pantry':return '+'+(l*2)+' cap → +'+((l+1)*2)+' cap';
 case 'decor':return (30+l*4)+'s → '+(34+l*4)+'s patience';
 case 'tips':return '+'+(l*15)+'% → +'+((l+1)*15)+'% tips';}}
const HATS=[
 {name:'Classic White',col:'#f6f2ea'},{name:'Tomato Red',col:'#e14b3b'},
 {name:'Blueberry',col:'#3b7de1'},{name:'Charcoal',col:'#3f3f46'},
 {name:'Aubergine',col:'#8e44ad'},{name:'Golden Chef',col:'#ffc63f'}];
const PASS=[
 {xp:100,coins:50},{xp:100,hat:1},{xp:100,coins:80},{xp:100,hat:2},
 {xp:120,coins:120},{xp:120,hat:3},{xp:120,coins:150},{xp:140,hat:4},
 {xp:140,coins:200},{xp:140,hat:5},{xp:160,coins:300},{xp:160,coins:500}];
const BURN=7;

/* ---------- save / persistence (localStorage) ---------- */
const SKEY='pizzaRushSaveV1';
function defaultSave(){return{coins:40,day:1,muted:false,
 up:{oven:0,ovens:0,prep:0,pantry:0,decor:0,tips:0},
 hats:[0],hat:0,pass:{xp:0,claimed:0},
 daily:{date:'',ch:[]},stats:{served:0,perfect:0}};}
let save=defaultSave();
try{const raw=localStorage.getItem(SKEY);
 if(raw){const d=JSON.parse(raw);save=Object.assign(defaultSave(),d);
 save.up=Object.assign(defaultSave().up,d.up||{});
 save.pass=Object.assign({xp:0,claimed:0},d.pass||{});
 save.daily=d.daily||{date:'',ch:[]};save.hats=d.hats||[0];save.stats=d.stats||{served:0,perfect:0};}}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

/* ---------- global state ---------- */
const S={scene:'menu',time:0,paused:false,dispCoins:save.coins,muted:!!save.muted};
let P=null, R=null;
const hits=[];
function addHit(x,y,w,h,fn){hits.push({x,y,w,h,fn});}

/* ---------- daily challenges (date-seeded) ---------- */
const today=()=>new Date().toDateString();
function genChallenges(day,dateStr){
 let seed=7; for(let i=0;i<dateStr.length;i++)seed=(seed*31+dateStr.charCodeAt(i))>>>0;
 const rand=mulberry(seed);
 const total=Math.min(6+day,14);
 const unlocked=TOPPINGS.filter(t=>t.day<=day);
 const tp=unlocked[Math.floor(rand()*unlocked.length)];
 const pool=[
  {key:'serve',  icon:'🍕',txt:'Serve '+(total-1)+' pizzas in one shift',goal:total-1,rc:40,rx:40},
  {key:'perfect',icon:'⭐',txt:'Get 3 perfect serves (fast delivery)',goal:3,rc:50,rx:50},
  {key:'coins',  icon:'💰',txt:'Earn '+(day*50)+' coins in one shift',goal:day*50,rc:40,rx:40},
  {key:'top_'+tp.id,top:tp.id,icon:'🧂',txt:'Serve 3 pizzas with '+tp.name,goal:3,rc:50,rx:50},
  {key:'noangry',icon:'😇',txt:'Finish a shift with zero walkouts',goal:1,rc:70,rx:60}];
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
 return pool.slice(0,3).map(p=>Object.assign({prog:0,done:false,claimed:false},p));
}
function ensureDaily(){const d=today();
 if(save.daily.date!==d){save.daily={date:d,ch:genChallenges(save.day,d)};persist();}}
function chProgress(key,amt){ensureDaily();let fired=false;
 for(const c of save.daily.ch){ if(c.done||c.key!==key)continue;
  c.prog=Math.min(c.goal,c.prog+(amt||1));
  if(c.prog>=c.goal){c.done=true;fired=true;}}
 if(fired){toast('✅ Daily goal complete! Claim in GOALS');sfx('tier');persist();}}
function claimables(){ensureDaily();return save.daily.ch.filter(c=>c.done&&!c.claimed).length;}

/* ---------- pizza pass ---------- */
function passTier(){let acc=0,t=0;
 for(let i=0;i<PASS.length;i++){acc+=PASS[i].xp;if(save.pass.xp>=acc)t=i+1;else break;}return t;}
function passNextXP(){let acc=0;const t=passTier();
 for(let i=0;i<t;i++)acc+=PASS[i].xp;return acc;}
function addXP(n){if(n<=0)return;const b=passTier();save.pass.xp+=n;const a=passTier();
 if(a>b){toast('🎫 Pizza Pass → Tier '+a+'!');sfx('tier');}}

/* ---------- FX object pools ---------- */
const FX=[];for(let i=0;i<260;i++)FX.push({on:false});
function spawnFX(o){for(const f of FX){if(!f.on){f.on=true;f.t=0;
 for(const k in o)f[k]=o[k];return;}}return null;}
const FTS=[];for(let i=0;i<44;i++)FTS.push({on:false});
function floatText(t,x,y,col,size){for(const f of FTS){if(!f.on){f.on=true;f.t=0;
 f.txt=t;f.x=x;f.y=y;f.col=col||'#3a2a1e';f.size=size||16;f.life=1.15;return;}}}
const TOASTS=[];
function toast(t){TOASTS.push({txt:t,t:0,life:2.8});if(TOASTS.length>3)TOASTS.shift();}
function confetti(x,y,n){const cols=['#e14b3b','#ffc63f','#57b26a','#3b7de1','#e56aa0','#fff'];
 for(let i=0;i<n;i++)spawnFX({type:'conf',x,y,vx:(Math.random()-0.5)*280,
  vy:-Math.random()*260-80,col:cols[i%cols.length],size:4+Math.random()*4,
  rot:Math.random()*6,vr:(Math.random()-0.5)*12,life:1.3});}
function hearts(x,y){for(let i=0;i<5;i++)spawnFX({type:'heart',x:x+(Math.random()-0.5)*40,
 y:y+(Math.random()-0.5)*16,ph:Math.random()*6,life:1.1});}
function smoke(x,y,n){for(let i=0;i<(n||6);i++)spawnFX({type:'smoke',
 x:x+(Math.random()-0.5)*24,y:y+(Math.random()-0.5)*12,r:6+Math.random()*6,life:1.2});}
function sparks(x,y){for(let i=0;i<9;i++){const a=Math.random()*6.28;
 spawnFX({type:'spark',x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,col:'#ffd23f',life:0.5});}}
function coinFly(sx,sy){for(let i=0;i<4;i++)spawnFX({type:'coin',sx:sx+(Math.random()-0.5)*24,
 sy:sy+(Math.random()-0.5)*20,tx:64,ty:26,life:0.6+i*0.08,x:sx,y:sy});}
function updateFX(dt){for(const f of FX){if(!f.on)continue;f.t+=dt;
 switch(f.type){
  case 'conf':f.vy+=620*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.rot+=f.vr*dt;break;
  case 'heart':f.y-=36*dt;f.x+=Math.sin(f.t*6+f.ph)*14*dt;break;
  case 'smoke':f.y-=28*dt;f.r+=16*dt;break;
  case 'spark':f.x+=f.vx*dt;f.y+=f.vy*dt;break;
  case 'coin':{const k=Math.min(1,f.t/f.life),e=k*k*(3-2*k);
   f.x=lerp(f.sx,f.tx,e);f.y=lerp(f.sy,f.ty,e)-Math.sin(k*Math.PI)*70;break;}}
 if(f.t>=f.life)f.on=false;}}
function updateFT(dt){for(const f of FTS){if(!f.on)continue;f.t+=dt;f.y-=34*dt;
 if(f.t>=f.life)f.on=false;}}
function updateToasts(dt){for(let i=TOASTS.length-1;i>=0;i--){TOASTS[i].t+=dt;
 if(TOASTS[i].t>TOASTS[i].life)TOASTS.splice(i,1);}}

/* ---------- pizza & customer art ---------- */
function topSlot(seed,i){const k=(seed+i*5)%9;if(k===0)return[0,0];
 const a=(k-1)*Math.PI/4,j=((seed*(i+3))%9)/9*0.12;
 return[Math.cos(a)*(0.5+j),Math.sin(a)*(0.5+j)];}
function drawTop(id,x,y,s,burnt){switch(id){
 case 'pep':ctx.fillStyle=burnt?'#4a2a22':'#c8402f';circle(x,y,s);
  ctx.fillStyle=burnt?'#38201a':'#a5301f';circle(x-s*0.3,y-s*0.2,s*0.18);
  circle(x+s*0.3,y+s*0.15,s*0.18);circle(x-s*0.05,y+s*0.4,s*0.15);break;
 case 'mush':ctx.fillStyle=burnt?'#5a4a38':'#d9bd92';
  ctx.beginPath();ctx.arc(x,y,s*0.9,Math.PI,0);ctx.fill();
  ctx.fillStyle=burnt?'#4a3c2c':'#efe0c2';ctx.fillRect(x-s*0.3,y,s*0.6,s*0.6);break;
 case 'pepr':ctx.strokeStyle=burnt?'#3f4a35':'#4caf50';ctx.lineWidth=s*0.5;
  ctx.beginPath();ctx.arc(x,y,s*0.7,0,6.2832);ctx.stroke();break;
 case 'oliv':ctx.fillStyle=burnt?'#262626':'#3d3d3d';circle(x,y,s*0.72);
  ctx.fillStyle=burnt?'#3a3a3a':'#6a6a6a';circle(x,y,s*0.28);break;
 case 'onion':ctx.strokeStyle=burnt?'#5a3a5a':'#b45fc4';ctx.lineWidth=s*0.35;
  ctx.beginPath();ctx.arc(x,y,s*0.75,0.4,2.6);ctx.stroke();break;
 case 'basil':ctx.fillStyle=burnt?'#33402c':'#2f8f3e';ctx.save();ctx.translate(x,y);
  ctx.rotate(0.5);ctx.beginPath();ctx.ellipse(0,0,s,s*0.55,0,0,6.2832);ctx.fill();
  ctx.strokeStyle=burnt?'#26301f':'#1e6b2c';ctx.lineWidth=s*0.14;
  ctx.beginPath();ctx.moveTo(-s,0);ctx.lineTo(s,0);ctx.stroke();ctx.restore();break;
 case 'pinea':ctx.fillStyle=burnt?'#5a4a26':'#f6c945';
  ctx.beginPath();ctx.moveTo(x,y-s);ctx.lineTo(x+s*0.9,y+s*0.7);
  ctx.lineTo(x-s*0.9,y+s*0.7);ctx.closePath();ctx.fill();
  ctx.strokeStyle=burnt?'#453a1e':'#d9a520';ctx.lineWidth=s*0.16;ctx.stroke();break;}}
function drawPizza(x,y,r,p,cook){ // cook: 0 raw 1 done 2 burnt
 const burnt=cook===2;
 let base='#f2d6a0',crust='#e0b26a';
 if(cook===1){base='#eec27f';crust='#d29a4e';}
 if(burnt){base='#6b543c';crust='#4a3826';}
 ctx.fillStyle=crust;circle(x,y,r);
 ctx.fillStyle=base;circle(x,y,r*0.86);
 if(p.sauce){ctx.fillStyle=burnt?'#5a2f22':'#d84c3e';circle(x,y,r*0.72);}
 if(p.cheese){ctx.fillStyle=burnt?'#7a6a4a':'#ffd75e';circle(x,y,r*0.6);
  for(let k=0;k<8;k++){const a=k*Math.PI/4+((p.seed||0)%7)*0.3;
   ctx.beginPath();ctx.arc(x+Math.cos(a)*r*0.6,y+Math.sin(a)*r*0.6,r*0.14,0,6.2832);ctx.fill();}}
 if(p.tops)for(let i=0;i<p.tops.length;i++){const q=topSlot(p.seed||0,i);
  drawTop(p.tops[i],x+q[0]*r,y+q[1]*r,r*0.24,burnt);}}
function drawTopIcon(id,x,y,s){drawTop(id,x,y,s,false);}
function drawBinIcon(id,x,y){switch(id){
 case 'dough':ctx.fillStyle='#f2d6a0';circle(x,y,15);ctx.fillStyle='#e0b26a';
  ctx.beginPath();ctx.arc(x,y,15,0.6,2.2);ctx.lineWidth=3;ctx.strokeStyle='#d8a960';ctx.stroke();break;
 case 'sauce':ctx.fillStyle='#d84c3e';circle(x,y,14);ctx.fillStyle='#ff8a7a';circle(x-4,y-5,4);break;
 case 'cheese':ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(x-14,y+10);
  ctx.lineTo(x+14,y+10);ctx.lineTo(x+6,y-12);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e0a92f';circle(x-2,y+3,2.6);circle(x+6,y+5,2);break;
 default:drawTopIcon(id,x,y,11);}}
const SKIN=['#ffd9b3','#f3c08e','#cf9265','#9c6b43','#7a4f30'];
const SHIRT=['#e14b3b','#3b7de1','#57b26a','#f0a030','#8e44ad','#2bb3b8','#e56aa0','#7a6ab0'];
const HAIRC=['#3a2a1e','#6b4a2f','#1e1e1e','#b3843a','#8a8a8a','#b04a2f'];
function genLook(){return{skin:SKIN[Math.floor(Math.random()*SKIN.length)],
 shirt:SHIRT[Math.floor(Math.random()*SHIRT.length)],
 hairC:HAIRC[Math.floor(Math.random()*HAIRC.length)],
 hair:Math.floor(Math.random()*4)};}
function drawHat(x,y,s,col){ctx.fillStyle=col;
 rr(x-s*0.62,y-s*0.28,s*1.24,s*0.5,s*0.14);ctx.fill();
 circle(x-s*0.4,y-s*0.5,s*0.34);circle(x,y-s*0.62,s*0.4);circle(x+s*0.4,y-s*0.5,s*0.34);
 ctx.strokeStyle='rgba(0,0,0,0.12)';ctx.lineWidth=1.5;
 rr(x-s*0.62,y-s*0.28,s*1.24,s*0.5,s*0.14);ctx.stroke();}
function drawCustomer(c){
 const bob=c.state==='wait'?Math.sin(S.time*2.4+c.seed*9)*1.6:0;
 const x=c.x+(c.shakeT>0?Math.sin(S.time*60)*3:0),y=196+bob;
 ctx.save();ctx.globalAlpha=clamp(c.alpha,0,1);
 ctx.fillStyle='rgba(0,0,0,0.15)';ctx.beginPath();ctx.ellipse(x,252,24,6,0,0,6.2832);ctx.fill();
 ctx.fillStyle=c.look.shirt;rr(x-21,y+6,42,44,12);ctx.fill();
 ctx.fillStyle=c.look.skin;circle(x,y-14,19);
 ctx.fillStyle=c.look.hairC;
 if(c.look.hair===1){ctx.beginPath();ctx.arc(x,y-18,19,Math.PI,0);ctx.fill();}
 else if(c.look.hair===2){ctx.beginPath();ctx.arc(x,y-18,19,Math.PI,0);ctx.fill();circle(x,y-38,8);}
 else if(c.look.hair===3){ctx.fillStyle='#3b7de1';ctx.beginPath();ctx.arc(x,y-20,19,Math.PI,0);ctx.fill();
  ctx.fillRect(x-24,y-22,48,5);}
 const pct=c.patience/c.maxP;
 ctx.fillStyle='#2a1c12';
 const blink=((S.time+c.seed*3)%3.7)<0.12;
 if(blink){ctx.fillRect(x-9,y-16,6,2);ctx.fillRect(x+3,y-16,6,2);}
 else{circle(x-6,y-15,2.4);circle(x+6,y-15,2.4);}
 ctx.strokeStyle='#2a1c12';ctx.lineWidth=2;
 if(c.state==='happy'){ctx.beginPath();ctx.arc(x,y-8,6,0.2,Math.PI-0.2);ctx.stroke();}
 else if(pct>0.55){ctx.beginPath();ctx.arc(x,y-7,5,0.3,Math.PI-0.3);ctx.stroke();}

/* ---------- session logic ---------- */
const cookTime=()=>7.5-save.up.oven*0.8;
const refillIv=()=>Math.max(1.8,4-save.up.pantry*0.45);
const maxPatience=d=>Math.max(22,30-d*0.6)+save.up.decor*4;
function matches(p,order){if(!p.dough||!p.sauce||!p.cheese)return false;
 if(p.tops.length!==order.tops.length)return false;
 return [...p.tops].sort().join(',')===[...order.tops].sort().join(',');}
function genOrder(day){const pool=TOPPINGS.filter(t=>t.day<=day);let n=1;
 if(day===2)n=1+(Math.random()<0.5?1:0);
 else if(day===3)n=2;
 else if(day===4)n=2+(Math.random()<0.4?1:0);
 else if(day===5)n=2+(Math.random()<0.7?1:0);
 else n=Math.min(4,2+(Math.random()<0.75?1:0)+(Math.random()<0.35?1:0));
 n=Math.min(n,pool.length);const bag=[...pool],tops=[];
 while(tops.length<n)tops.push(bag.splice(Math.floor(Math.random()*bag.length),1)[0].id);
 return{tops};}
function startDay(){
 const day=save.day,capB=10+save.up.pantry*2,capT=6+save.up.pantry*2;
 P={day,t:0,countdown:3.6,total:Math.min(6+day,14),spawned:0,served:0,angry:0,
  perfects:0,coinsEarned:0,customers:[],ovens:[],tray:[],prep:[],activePrep:0,
  bins:{},spawnT:1.2,over:false,endT:0,goT:0};
 for(let i=0;i<1+save.up.prep;i++)P.prep.push(null);
 for(let i=0;i<1+save.up.ovens;i++)P.ovens.push({state:'idle',pizza:null,t:0,cookT:0});
 P.bins.dough={n:capB,cap:capB,t:0};P.bins.sauce={n:capB,cap:capB,t:0};
 P.bins.cheese={n:capB+2,cap:capB+2,t:0};
 for(const t of TOPPINGS.filter(t=>t.day<=day))P.bins[t.id]={n:capT,cap:capT,t:0,shakeT:0};
 S.scene='play';S.paused=false;}
function freeSlot(){const used=new Set();
 for(const c of P.customers)if(c.state==='enter'||c.state==='wait')used.add(c.slot);
 for(let i=0;i<4;i++)if(!used.has(i))return i;return -1;}
function spawnCustomer(){const slot=freeSlot();if(slot<0)return;
 P.customers.push({order:genOrder(P.day),slot,x:Math.random()<0.5?-40:520,
  tx:72+slot*112,state:'enter',patience:maxPatience(P.day),maxP:maxPatience(P.day),
  look:genLook(),seed:Math.random()*10,t:0,alpha:1,shakeT:0});
 P.spawned++;sfx('pop');}
function tryServe(c){
 const idx=P.tray.findIndex(p=>matches(p,c.order));
 if(idx<0){c.shakeT=0.4;sfx('error');floatText('No matching pizza!',c.x,180,'#e14b3b',13);return;}
 P.tray.splice(idx,1);
 const pct=c.patience/c.maxP,perfect=pct>0.6;
 const coins=8+3*c.order.tops.length+Math.round(pct*10*(1+0.15*save.up.tips))+(perfect?6:0);
 save.coins+=coins;P.coinsEarned+=coins;P.served++;save.stats.served++;
 chProgress('serve');for(const tp of c.order.tops)chProgress('top_'+tp,1);
 if(perfect){P.perfects++;save.stats.perfect++;addXP(5);chProgress('perfect');
  floatText('PERFECT! +'+coins,c.x,150,'#f5a623',18);sfx('perfect');}
 else{addXP(2);floatText('+'+coins,c.x,150,'#2e7d32',16);sfx('serve');}
 hearts(c.x,180);coinFly(c.x,200);sfx('coin');
 c.state='happy';c.t=0;}
function tapIng(id){
 if(!P||S.paused||P.countdown>0||P.over)return;
 const bin=P.bins[id];
 if(bin&&bin.n<=0){bin.shakeT=0.4;floatText('Restocking…',240,640,'#e14b3b',14);sfx('error');return;}
 let slot=P.prep[P.activePrep];
 if(!slot){if(id!=='dough'){floatText('Start with dough!',240,540,'#e14b3b',14);sfx('error');return;}
  slot={dough:false,sauce:false,cheese:false,tops:[],seed:(Math.random()*999)|0};
  P.prep[P.activePrep]=slot;}
 let ok=false,msg='';
 if(id==='dough'){if(slot.dough)msg='Already has dough';else{slot.dough=true;ok=true;}}
 else if(id==='sauce'){if(!slot.dough)msg='Add dough first';
  else if(slot.sauce)msg='Already sauced';else{slot.sauce=true;ok=true;}}
 else if(id==='cheese'){if(!slot.sauce)msg='Add sauce first';
  else if(slot.cheese)msg='Extra-cheesy already';else{slot.cheese=true;ok=true;}}
 else{if(!slot.cheese)msg='Add cheese first';else{slot.tops.push(id);ok=true;}}
 if(ok){if(bin)bin.n--;sfx('pop');}
 else{floatText(msg,240,540,'#e14b3b',14);sfx('error');}}
function sendToOven(){
 if(!P||S.paused||P.countdown>0||P.over)return;
 const p=P.prep[P.activePrep];
 if(!p||!p.dough){floatText('Build a pizza first!',240,540,'#e14b3b',14);sfx('error');return;}
 const o=P.ovens.find(o=>o.state==='idle');
 if(!o){floatText('Ovens full!',240,300,'#e14b3b',15);sfx('error');return;}
 o.pizza=p;o.state='cooking';o.t=0;o.cookT=cookTime();
 P.prep[P.activePrep]=null;
 for(let i=0;i<P.prep.length;i++)if(P.prep[i]){P.activePrep=i;break;}
 sfx('oven');}
function tapOven(i){const o=P.ovens[i];if(!o)return;
 if(o.state==='done'){if(P.tray.length>=3){floatText('Tray full!',412,300,'#e14b3b',14);sfx('error');return;}
  P.tray.push(o.pizza);o.pizza=null;o.state='idle';sfx('pop');}
 else if(o.state==='burnt'){smoke(62+i*104,352,8);o.pizza=null;o.state='idle';sfx('burn');}}
function trashActive(){const p=P.prep[P.activePrep];if(!p)return;
 P.prep[P.activePrep]=null;smoke(240,492,4);sfx('burn');}
function finishDay(quit){
 const total=P.total,served=P.served,pct=quit?0:served/total;
 const stars=quit?0:(pct>=0.85?3:pct>=0.65?2:pct>=0.4?1:0);
 const xp=stars*10+(stars>0?10:0);
 if(xp>0)addXP(xp);
 if(!quit){chProgress('coins',P.coinsEarned);
  if(P.angry===0&&P.spawned===P.total)chProgress('noangry',1);}
 R={day:P.day,stars,served,total,perfects:P.perfects,coins:P.coinsEarned,
  angry:P.angry,xp,t:0,quit,sfxN:0,fx:false,
  next:TOPPINGS.find(t=>t.day===save.day+1)};
 persist();S.scene='dayend';}
function checkEnd(){if(P.over)return;
 const active=P.customers.some(c=>c.state==='enter'||c.state==='wait'||c.state==='happy'||c.state==='angry');
 if(P.spawned>=P.total&&!active){P.over=true;P.endT=1.1;}}
function updatePlay(dt){
 if(S.paused)return;
 P.t+=dt;
 if(P.goT>0)P.goT-=dt;
 if(P.countdown>0){P.countdown-=dt;if(P.countdown<=0)P.goT=0.7;updateFXonly(dt);return;}
 if(P.over){P.endT-=dt;if(P.endT<=0)finishDay(false);updateFXonly(dt);return;}
 if(P.spawned<P.total){P.spawnT-=dt;
  if(P.spawnT<=0){if(freeSlot()>=0){spawnCustomer();
   P.spawnT=Math.max(5.5,14-P.day*1.1)*(0.8+Math.random()*0.5);}else P.spawnT=0.6;}}
 for(const c of P.customers){c.t+=dt;if(c.shakeT>0)c.shakeT-=dt;
  switch(c.state){
   case 'enter':c.x+=(c.tx-c.x)*Math.min(1,dt*6);
    if(Math.abs(c.x-c.tx)<1.5){c.x=c.tx;c.state='wait';}break;
   case 'wait':c.patience-=dt;
    if(c.patience<=0){c.state='angry';c.t=0;P.angry++;sfx('angry');
     smoke(c.x,190,5);floatText('💢 Too slow!',c.x,150,'#e14b3b',15);}break;
   case 'angry':if(c.t>0.7)c.state='leave';break;
   case 'happy':if(c.t>0.9)c.state='leave';break;
   case 'leave':c.x+=160*dt;c.alpha-=dt*1.4;if(c.alpha<=0)c.dead=true;break;}}
 P.customers=P.customers.filter(c=>!c.dead);
 for(const k in P.bins){const b=P.bins[k];
  if(b.shakeT>0)b.shakeT-=dt;
  if(b.n<b.cap){b.t+=dt;if(b.t>=refillIv()){b.t=0;b.n++;}}}
 P.ovens.forEach((o,i)=>{
  if(o.state==='cooking'){o.t+=dt;
   if(Math.random()<dt*6)spawnFX({type:'steam',x:62+i*104+(Math.random()-0.5)*30,y:330,ph:Math.random()*6,life:0.8});
   if(o.t>=o.cookT){o.state='done';sfx('ding');sparks(62+i*104,346);}}
  else if(o.state==='done'){o.t+=dt;
   if(o.t>=o.cookT+BURN){o.state='burnt';sfx('burn');smoke(62+i*104,346,7);}}});
 checkEnd();updateFXonly(dt);}
function updateFXonly(dt){updateFX(dt);updateFT(dt);}

function renderFX(){for(const f of FX){if(!f.on)continue;
 const a=1-f.t/f.life;
 switch(f.type){
  case 'conf':ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);
   ctx.globalAlpha=a;ctx.fillStyle=f.col;ctx.fillRect(-f.size/2,-f.size/2,f.size,f.size*0.6);
   ctx.restore();break;
  case 'heart':ctx.globalAlpha=a;heart(f.x,f.y,8,'#e14b6b');ctx.globalAlpha=1;break;
  case 'smoke':ctx.globalAlpha=a*0.5;ctx.fillStyle='#9a9a9a';circle(f.x,f.y,f.r);
   ctx.globalAlpha=1;break;
  case 'spark':ctx.globalAlpha=a;ctx.fillStyle=f.col;circle(f.x,f.y,3);ctx.globalAlpha=1;break;
  case 'coin':ctx.globalAlpha=Math.min(1,a*2);coinDraw(f.x,f.y,8);ctx.globalAlpha=1;break;}}}
function renderFT(){for(const f of FTS){if(!f.on)continue;
 ctx.globalAlpha=clamp((f.life-f.t)*2,0,1);
 txt(f.txt,f.x,f.y,f.size,f.col,'center',900);ctx.globalAlpha=1;}}
function renderToasts(){for(let i=0;i<TOASTS.length;i++){const t=TOASTS[i],
  k=Math.min(1,t.t*4),fade=t.t>t.life-0.5?clamp((t.life-t.t)*2,0,1):1;
 ctx.globalAlpha=k*fade;
 ctx.fillStyle='rgba(43,29,22,0.92)';
 const w=Math.min(420,t.txt.length*8+40);
 rr(240-w/2,64+i*36,w,30,15);ctx.fill();
 txt(t.txt,240,79+i*36,12,'#ffe9c4','center',800);ctx.globalAlpha=1;}}

/* ---------- input ---------- */
function toLocal(e){const r=canvas.getBoundingClientRect();
 return{x:(e.clientX-r.left-offX)/scaleF,y:(e.clientY-r.top-offY)/scaleF};}
canvas.addEventListener('pointerdown',e=>{
 e.preventDefault();initAudio();
 if(actx&&actx.state==='suspended')actx.resume();
 const p=toLocal(e);
 for(let i=hits.length-1;i>=0;i--){const h=hits[i];
  if(p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h){sfx('tap');h.fn();return;}}},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.scene==='play')S.paused=!S.paused;});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden&&S.scene==='play')S.paused=true;});

/* ---------- main loop (fixed timestep) ---------- */
function update(dt){
 S.dispCoins+=(save.coins-S.dispCoins)*Math.min(1,dt*8);
 if(Math.abs(save.coins-S.dispCoins)<0.6)S.dispCoins=save.coins;
 updateToasts(dt);
 if(S.scene==='play'){updatePlay(dt);}
 else{updateFX(dt);updateFT(dt);}
 if(S.scene==='dayend'&&R)R.t+=dt;}
function render(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.fillStyle='#241611';ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(dpr*scaleF,0,0,dpr*scaleF,offX*dpr,offY*dpr);
 ctx.save();ctx.beginPath();ctx.rect(0,0,VW,VH);ctx.clip();
 hits.length=0;
 switch(S.scene){
  case 'menu':renderMenu();break;
  case 'shop':renderShop();break;
  case 'pass':renderPass();break;
  case 'goals':renderGoals();break;
  case 'play':renderPlay();break;
  case 'dayend':renderDayEnd();break;}
 renderToasts();
 ctx.restore();}
let last=performance.now(),acc=0;const STEP=1/60;
function frame(now){requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(dt>0.25)dt=0.25;
 S.time+=dt;acc+=dt;
 while(acc>=STEP){update(STEP);acc-=STEP;}
 render();}
ensureDaily();
requestAnimationFrame(frame);
</script>
