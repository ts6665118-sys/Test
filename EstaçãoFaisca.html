<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Estação Faísca — Cantina & Teatro Mecânico</title>
<style>
:root{
  --bg:#0d0a09; --panel:#1c1613; --panel2:#262019; --line:#4a3b2b;
  --amber:#ffb454; --amber2:#ff8a3d; --text:#f3e6cf; --dim:#9a8b78;
  --green:#8fe08a; --red:#ff5a4e; --cyan:#7fd4d0; --yellow:#ffd24e;
  --hud-h: clamp(34px, 6.5vh, 56px);
  --bot-h: clamp(46px, 9vh, 66px);
  --btn-h: calc(var(--bot-h) - 12px);
  --fs-ui: clamp(9px, 1.8vh, 14px);
  --fs-big: clamp(11px, 2vh, 15px);
  --pad: clamp(4px, 1vh, 8px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#050403;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:"Courier New",Consolas,monospace;color:var(--text);font-size:var(--fs-ui)}
#app{position:fixed;inset:0;height:100vh;height:100dvh;background:var(--bg);display:flex;flex-direction:column}

#hud{height:var(--hud-h);flex:0 0 var(--hud-h);display:flex;align-items:center;gap:6px;
  padding:0 var(--pad);background:linear-gradient(#221a13,#171009);border-bottom:2px solid var(--line);
  z-index:30;font-size:var(--fs-ui);overflow:hidden;white-space:nowrap}
.stat{display:flex;align-items:center;gap:4px;background:#00000055;border:1px solid #00000088;
  border-radius:6px;padding:2px 8px;white-space:nowrap}
.stat b{color:var(--amber)}
.stat.money b{color:var(--yellow)}
#hud .grow{flex:1}
.hbtn{min-width:calc(var(--hud-h) - 8px);height:calc(var(--hud-h) - 10px);border-radius:7px;
  border:2px solid var(--line);background:linear-gradient(#2c231b,#1a130e);color:var(--amber);
  font:bold var(--fs-big) "Courier New",monospace}
.hbtn:active{transform:translateY(2px)}
@media (max-width:640px){ #hud .stat:nth-child(6){display:none} }
@media (max-width:520px){ #hud .stat:nth-child(5){display:none} }

#stage{flex:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;
  background:#060504;overflow:hidden}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
#scan{position:absolute;inset:0;pointer-events:none;z-index:5;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#00000022 2px 4px)}
#vig{position:absolute;inset:0;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at center,transparent 55%,#000000aa 100%)}

#bottom{height:var(--bot-h);flex:0 0 var(--bot-h);display:flex;align-items:center;gap:6px;
  padding:0 var(--pad);background:linear-gradient(#171009,#221a13);border-top:2px solid var(--line);z-index:30}
.tab{flex:1 1 0;min-width:0;height:var(--btn-h);border-radius:8px;border:2px solid var(--line);
  background:linear-gradient(#2c231b,#191209);color:#d8c49b;font:bold var(--fs-ui) "Courier New",monospace;
  letter-spacing:.4px;text-transform:uppercase;overflow:hidden;white-space:nowrap;padding:0 4px}
.tab.on{color:#1a1108;background:linear-gradient(#ffc978,#ff9d3f);border-color:#b97b2a}
#btnOpen{height:var(--btn-h);flex:0 0 auto;min-width:clamp(120px,20vw,190px);padding:0 8px;border-radius:8px;
  border:2px solid #7c2c22;background:linear-gradient(#ff7a4d,#c33b1f);color:#fff;
  font:bold var(--fs-ui) "Courier New",monospace;letter-spacing:1px;text-shadow:0 1px 0 #00000088;
  animation:pulse 2.4s infinite;white-space:nowrap}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff7a4d55}50%{box-shadow:0 0 14px 3px #ff7a4d77}}
@media (max-width:700px){ .tab .lbl{display:none} .tab{font-size:calc(var(--fs-ui) + 3px)} }

.btn{min-height:calc(var(--btn-h) - 2px);padding:6px 14px;border-radius:8px;border:2px solid var(--line);
  background:linear-gradient(#2c231b,#1a130e);color:#ffd9a0;font:bold var(--fs-big) "Courier New",monospace;
  letter-spacing:.5px;text-transform:uppercase}
.btn:active{transform:translateY(2px)}
.btn.primary{background:linear-gradient(#ffc978,#ff9d3f);color:#241302;border-color:#b97b2a}
.btn.danger{background:linear-gradient(#ff6a5a,#b52c1e);color:#fff;border-color:#7c2c22}
.btn.green{background:linear-gradient(#9fe89a,#4fae52);color:#0b2410;border-color:#2c6e33}
.btn:disabled{opacity:.4;transform:none}
.btn.small{min-height:calc(var(--btn-h) - 12px);padding:4px 10px;font-size:var(--fs-ui)}

.hidden{display:none!important}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;box-shadow:0 8px 30px #000c}
#drawer{position:absolute;left:0;right:0;bottom:0;max-height:70%;z-index:40;display:flex;flex-direction:column;
  background:linear-gradient(#241c14,#161009);border-top:3px solid var(--amber2);border-radius:14px 14px 0 0;
  padding:var(--pad) 10px 12px;overflow:hidden}
#drawer h2{font-size:var(--fs-big);letter-spacing:2px;color:var(--amber);text-transform:uppercase;
  display:flex;align-items:center;gap:8px;margin-bottom:6px}
#drawerBody{overflow-y:auto;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch;padding-right:4px}
#drawerBody::-webkit-scrollbar{width:5px}
#drawerBody::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.closeX{margin-left:auto;min-width:40px;height:36px;border-radius:8px;border:2px solid var(--line);
  background:#00000066;color:var(--red);font:bold 16px monospace}

.modalWrap{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:#000000b8;padding:10px}
.modal{width:min(640px,96%);max-height:92%;overflow-y:auto;padding:14px;touch-action:pan-y;font-size:var(--fs-ui)}
.modal h2{color:var(--amber);letter-spacing:2px;font-size:var(--fs-big);text-transform:uppercase;margin-bottom:8px;
  border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:10px;background:#000000aa;border:1px solid #000;border-radius:5px;overflow:hidden;flex:1;min-width:60px}
.bar i{display:block;height:100%}
.chip{background:#00000055;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:var(--fs-ui)}
.card{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.card.sel{border-color:var(--amber)}
.card h3{font-size:calc(var(--fs-ui) + 2px);color:var(--amber);letter-spacing:1px}
.card small{color:var(--dim);font-size:calc(var(--fs-ui) - 1px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;font-size:calc(var(--fs-ui) - 1px);padding:1px 6px;border-radius:6px;
  border:1px solid var(--line);color:var(--dim);margin-right:4px}
.tag.ok{color:var(--green);border-color:#2c6e33}
.tag.bad{color:var(--red);border-color:#7c2c22}
.tag.warn{color:var(--yellow);border-color:#8a6d1f}

#roboList{position:absolute;left:6px;top:6px;bottom:6px;width:clamp(120px,18vw,158px);z-index:20;display:flex;
  flex-direction:column;gap:6px;overflow-y:auto;touch-action:pan-y;padding-right:2px}
.rcard{flex:0 0 auto;background:#1c1613ee;border:2px solid var(--line);border-radius:9px;padding:6px;cursor:pointer}
.rcard.sel{border-color:var(--amber);box-shadow:0 0 8px #ffb45433}
.rcard .nm{font:bold var(--fs-ui) monospace;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard .st{font-size:calc(var(--fs-ui) - 2px);margin-top:2px}

#repExit{position:absolute;top:8px;right:8px;z-index:25;height:38px;padding:0 12px;border-radius:8px;
  border:2px solid var(--line);background:#000000aa;color:#ff9a8e;font:bold var(--fs-ui) monospace}

/* ---------- Night UI ---------- */
#nightBar{position:absolute;left:0;right:0;bottom:0;z-index:35;display:flex;gap:6px;
  padding:var(--pad) 8px;background:linear-gradient(#000000dd,#00000088);align-items:center;
  overflow-x:auto;overflow-y:hidden;white-space:nowrap;scroll-snap-type:x proximity;
  touch-action:pan-x;-webkit-overflow-scrolling:touch}
#nightBar::-webkit-scrollbar{height:4px}
#nightBar::-webkit-scrollbar-thumb{background:#2a4a48;border-radius:2px}
.cbtn{flex:0 0 auto;min-width:clamp(44px,8vw,58px);height:var(--btn-h);border-radius:8px;
  border:2px solid #2a4a48;background:#0a1514;color:var(--cyan);font:bold var(--fs-ui) monospace}
.cbtn.on{background:linear-gradient(#7fd4d0,#3a8f8a);color:#03201e}
.abtn{flex:0 0 auto;min-width:max-content;height:var(--btn-h);border-radius:8px;border:2px solid var(--line);
  background:#1a130e;color:#ffd9a0;font:bold var(--fs-ui) monospace;padding:0 10px;touch-action:none}
.abtn.on{background:linear-gradient(#ffb454,#c96f1e);color:#241302}
.abtn.alert{animation:blinkA .5s infinite}
@keyframes blinkA{0%,100%{box-shadow:0 0 0 0 #ff5a4e00}50%{box-shadow:0 0 12px 4px #ff5a4ecc;border-color:var(--red)}}
/* destaque do tutorial */
.tutGlow{animation:tutPulse .9s infinite;border-color:var(--yellow)!important;position:relative;z-index:2}
@keyframes tutPulse{0%,100%{box-shadow:0 0 0 0 #ffd24e00}50%{box-shadow:0 0 16px 5px #ffd24ecc}}
@media (max-height:420px){
  .abtn span.lbl,.cbtn span.lbl{display:none}
  .abtn,.cbtn{min-width:44px;padding:0 6px}
}
#nightTop{position:absolute;left:0;right:0;top:0;z-index:35;display:flex;gap:8px;align-items:center;
  padding:var(--pad) 10px;background:linear-gradient(#000000cc,#00000000);font-size:var(--fs-ui);
  overflow:hidden;white-space:nowrap}
#ticker{position:absolute;top:calc(var(--hud-h) + 6px);left:50%;transform:translateX(-50%);z-index:36;
  font:bold var(--fs-ui) monospace;color:var(--yellow);text-shadow:0 0 8px #000;background:#000000aa;
  padding:3px 10px;border-radius:8px;border:1px solid #8a6d1f;max-width:90%;text-align:center;pointer-events:none}
/* card do mini-tutorial noturno */
#nightTutCard{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(var(--btn-h) + var(--pad)*2 + 12px);z-index:45;width:min(560px,94%);
  background:#161009f5;border:2px solid var(--amber2);border-radius:12px;padding:10px 12px;
  box-shadow:0 8px 26px #000d;font-size:var(--fs-ui)}

#scrTitle{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:clamp(6px,1.5vh,14px);background:radial-gradient(ellipse at 50% 30%,#241a10 0%,#0d0a09 70%);
  padding:10px}
#logo{font-size:clamp(22px,6vh,52px);font-weight:bold;letter-spacing:6px;color:var(--amber);
  text-shadow:0 0 18px #ffb45466,0 3px 0 #5a3a12;text-align:center}
#logoSub{color:var(--dim);letter-spacing:3px;font-size:clamp(9px,1.8vh,14px);text-align:center}
#cvTitle{width:clamp(140px,25vh,220px);image-rendering:pixelated}
.flick{animation:flick 4s infinite}
@keyframes flick{0%,93%,97%,100%{opacity:1}94%,96%{opacity:.4}}

#toasts{position:absolute;top:calc(var(--hud-h) + 4px);right:8px;z-index:90;display:flex;
  flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#1c1613f2;border:2px solid var(--line);border-left:5px solid var(--amber);border-radius:8px;
  padding:6px 12px;font-size:var(--fs-ui);max-width:min(300px,60vw);animation:tin .25s;box-shadow:0 4px 14px #000a}
.toast.good{border-left-color:var(--green)}
.toast.bad{border-left-color:var(--red)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

#tut{position:absolute;inset:0;z-index:95;display:flex;align-items:flex-end;justify-content:center;
  background:#00000055;padding-bottom:calc(var(--bot-h) + 14px);pointer-events:auto}
#tutCard{width:min(560px,92%);padding:14px}
#tutCard p{font-size:calc(var(--fs-ui) + 1px);line-height:1.5;margin:8px 0}

#rotate{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
@media (orientation:portrait){#rotate{display:flex}}
#rotate .big{font-size:44px;animation:rotA 1.6s infinite}
@keyframes rotA{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(90deg)}}

input[type=range]{width:clamp(110px,30vw,180px);accent-color:var(--amber)}
.hr{height:1px;background:var(--line);margin:8px 0}
.center{text-align:center}
.logTxt{font-size:var(--fs-ui);line-height:1.6;color:#e8d9bd;background:#00000044;
  border-left:3px solid var(--amber2);padding:8px;border-radius:0 8px 8px 0;margin-top:6px;white-space:pre-wrap}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="stat" id="hDia">DIA <b>1</b></div>
    <div class="stat" id="hHora">⏱ <b>08:00</b></div>
    <div class="stat money">💰 <b>CR$ 0</b></div>
    <div class="stat">★ <b>50</b></div>
    <div class="stat">😊 <b>70</b></div>
    <div class="stat">🧹 <b>80</b></div>
    <div class="grow"></div>
    <button class="hbtn" id="btnAch" title="Conquistas">🏆</button>
    <button class="hbtn" id="btnSet" title="Configurações">⚙</button>
  </div>

  <div id="stage">
    <canvas id="cv" width="480" height="270"></canvas>
    <div id="scan"></div><div id="vig"></div>
    <div id="roboList" class="hidden"></div>
    <button id="repExit" class="hidden">✕ ABORTAR</button>
    <div id="nightTop" class="hidden"></div>
    <div id="ticker" class="hidden"></div>
    <div id="nightTutCard" class="hidden"></div>
    <div id="nightBar" class="hidden"></div>
    <div id="drawer" class="hidden"><h2 id="drawerTitle"></h2><div id="drawerBody"></div></div>
  </div>

  <div id="bottom">
    <button class="tab" data-tab="oficina">🔧<span class="lbl"> Oficina</span></button>
    <button class="tab" data-tab="loja">🛒<span class="lbl"> Loja</span></button>
    <button class="tab" data-tab="equipe">⚙<span class="lbl"> Equipe</span></button>
    <button class="tab" data-tab="contratos">📋<span class="lbl"> Contratos</span></button>
    <button class="tab" data-tab="arquivos">📼<span class="lbl"> Arquivos</span></button>
    <button id="btnOpen">▶ ABRIR O SALÃO</button>
  </div>

  <div id="toasts"></div>
  <div id="tut" class="hidden"></div>
  <div id="modalHost"></div>

  <div id="scrTitle">
    <div id="logo" class="flick">ESTAÇÃO FAÍSCA</div>
    <div id="logoSub">CANTINA &amp; TEATRO MECÂNICO · desde 1984</div>
    <canvas id="cvTitle" width="160" height="120"></canvas>
    <div class="row" style="flex-direction:column;gap:10px">
      <button class="btn primary" id="btnNew" style="min-width:min(260px,70vw)">🔩 NOVO TURNO</button>
      <button class="btn" id="btnCont" style="min-width:min(260px,70vw)">💾 CONTINUAR</button>
      <button class="btn" id="btnCred" style="min-width:min(260px,70vw)">ℹ SOBRE</button>
    </div>
  </div>

  <div id="rotate"><div class="big">📱</div><div style="letter-spacing:2px">GIRE O APARELHO PARA O MODO PAISAGEM</div></div>
</div>

<script>
"use strict";
/* ============================================================
   ESTAÇÃO FAÍSCA — jogo original de gestão + horror leve
   ============================================================ */

/* ---------------- HELPERS ---------------- */
const W=480,H=270;
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>"CR$ "+Math.round(n).toLocaleString("pt-BR");
const hhmm=m=>{const t=480+Math.max(0,m);return String(Math.floor(t/60)%24).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0")};
function shade(hex,p){
  const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+p,0,255),g=clamp(((n>>8)&255)+p,0,255),b=clamp((n&255)+p,0,255);
  return `rgb(${r},${g},${b})`;
}

/* ---------------- SAVE ---------------- */
const SAVE_KEY="estacaoFaica_v1";
const SaveManager={
  save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(Serial.pack())); }catch(e){} },
  load(){ try{ const s=localStorage.getItem(SAVE_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } },
  wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
};

/* ---------------- AUDIO ---------------- */
const AU={ctx:null,master:null,on:true,vol:.75,amb:null,ambNodes:[],heart:null};
function auInit(){
  if(AU.ctx) return;
  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.vol; AU.master.connect(AU.ctx.destination);
  }catch(e){}
}
function tone(f,d=.1,type="square",v=.18,slide=0){
  if(!AU.ctx||!AU.on) return;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain(),t=AU.ctx.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+d+.02);
}
function noiseB(d=.2,v=.2,fq=1200){
  if(!AU.ctx||!AU.on) return;
  const n=AU.ctx.sampleRate*d,buf=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),ch=buf.getChannelData(0);
  for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
  const s=AU.ctx.createBufferSource(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();
  s.buffer=buf;f.type="lowpass";f.frequency.value=fq;g.gain.value=v;
  s.connect(f);f.connect(g);g.connect(AU.master);s.start();
}
const SFX={
  click(){tone(880,.05,"square",.08)},
  ok(){tone(660,.09,"triangle",.16);setTimeout(()=>tone(990,.12,"triangle",.16),90)},
  err(){tone(180,.2,"sawtooth",.15,-80)},
  cash(){tone(1200,.07,"square",.12);setTimeout(()=>tone(1600,.1,"square",.12),70)},
  screw(){noiseB(.08,.1,2500)},
  scrub(){noiseB(.1,.08,900)},
  spark(){noiseB(.12,.22,4000);tone(2400,.08,"sawtooth",.1)},
  alarm(){tone(720,.25,"square",.2,-200);setTimeout(()=>tone(720,.25,"square",.2,-200),320)},
  foot(v){noiseB(.12,.12*v,220);tone(70,.1,"sine",.14*v)},
  door(){tone(120,.3,"square",.2,-40);noiseB(.2,.15,400)},
  hide(){tone(300,.4,"sine",.12,-180)},
  scare(){noiseB(.9,.5,3000);tone(90,.9,"sawtooth",.4,-40);tone(123,.9,"sawtooth",.35,-60)},
  trip(){tone(240,.3,"square",.2,-160);noiseB(.25,.2,600)},
};
function startAmbient(mode){
  stopAmbient();
  if(!AU.ctx||!AU.on) return;
  const t=AU.ctx.currentTime;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
  o.type="sine";o.frequency.value=mode==="night"?48:60;
  g.gain.value=mode==="night"?.05:.03;o.connect(g);g.connect(AU.master);o.start(t);
  AU.ambNodes.push(o,g);
  AU.amb=setInterval(()=>{
    if(!AU.on) return;
    if(Math.random()<.5) tone(mode==="night"?rnd(90,160):rnd(700,1100),.15,mode==="night"?"sine":"triangle",.05,mode==="night"?-30:-200);
    else noiseB(.15,.04,mode==="night"?300:1800);
  },mode==="night"?5200:7500);
}
function stopAmbient(){ if(AU.amb){clearInterval(AU.amb);AU.amb=null;} AU.ambNodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){} try{n.disconnect()}catch(e){}}); AU.ambNodes=[]; }
function heartbeat(on){
  if(on&&!AU.heart){ AU.heart=setInterval(()=>{ if(AU.on){tone(58,.1,"sine",.3);setTimeout(()=>tone(52,.12,"sine",.26),180);} },850); }
  if(!on&&AU.heart){ clearInterval(AU.heart);AU.heart=null; }
}

/* ---------------- PARTICLES ---------------- */
const Parts={list:[],
  add(x,y,n,c,sp=40,life=.6,grav=60){for(let i=0;i<n;i++)this.list.push({x,y,vx:rnd(-sp,sp),vy:rnd(-sp,sp*.4),l:rnd(life*.5,life),c,g:grav});},
  update(dt){this.list=this.list.filter(p=>{p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;return p.l>0});},
  draw(g){this.list.forEach(p=>{g.globalAlpha=clamp(p.l*2,0,1);g.fillStyle=p.c;g.fillRect(p.x|0,p.y|0,2,2)});g.globalAlpha=1;}
};

 {id:"emerg",nome:"Reparo de Emergência",desc:(r)=>`${robDef(r).nome} precisa estar sem falhas até a noite.`,pag:()=>ri(300,480)},

function genContracts(){
  G.contratos=[];
  for(let i=0;i<3;i++){
    const t=pick(CTIPOS);
    const owned=G.robots.filter(r=>r.unlocked);
    const alvo=t.id==="emerg"&&owned.length?pick(owned).id:(Math.random()<.5&&owned.length?pick(owned).id:null);
    G.contratos.push({tipo:t.id,nome:t.nome,desc:t.desc(alvo),pag:t.pag(),alvo,aceito:false});
  }
}
function contratoCheck(c){
  const act=G.robots.filter(r=>r.unlocked&&r.saude>=30);
  if(c.tipo==="festa") return c.alvo? (robRT(c.alvo).saude>=30&&robRT(c.alvo).qual>=60) : act.length>=2;
  if(c.tipo==="vip") return act.length>0&&act.every(r=>r.saude>=75);
  if(c.tipo==="escola") return act.length>0&&act.reduce((a,r)=>a+r.qual,0)/act.length>=70;
  if(c.tipo==="emerg"){const r=robRT(c.alvo);return r&&r.falhas.length===0&&r.saude>=60;}
  return false;
}

function robotWear(){
  G.robots.forEach(r=>{
    if(!r.unlocked) return;
    const wear=ri(5,10)+(G.upg.clima?0:2);
    r.saude=clamp(r.saude-wear,0,100);
    r.estresse=clamp(r.estresse+(G.upg.clima?1:4)+ri(0,4),0,100);
    r.qual=clamp(r.qual-ri(0,3),0,100);

    }
    r.humor=r.estresse>70?"irritado":r.saude<35?"debilitado":r.qual>80?"radiante":"tranquilo";
  });
}

/* ---------------- REPARO ---------------- */
const Rep={
  start(robot){
    const tasks=robot.falhas.map(fid=>{
      const c=compById(fid);
      return {comp:fid,nome:c.nome,tipo:c.task,done:false,score:0};
    });
    G.rep={rid:robot.id,tasks,i:0,t:0,err:0,game:null};
    G.scene="repair";
    Rep.buildGame();
    setSceneUI("repair");
    UI.toast(`🔧 Reparo iniciado em <b>${robDef(robot.id).nome}</b>`);
  },
  buildGame(){
    const rp=G.rep; if(!rp) return;
    const task=rp.tasks[rp.i];
    if(!task){Rep.finish();return;}
    rp.err=0;rp.t=0;
    switch(task.tipo){
      case "troca": rp.game=Troca.new(task); break;
      case "limpar": rp.game=Limpar.new(); break;
      case "fios": rp.game=Fios.new(); break;
      case "calibrar": rp.game=Calibrar.new(); break;
      case "firmware": rp.game=Firmware.new(); break;
      case "equilibrio": rp.game=Equilibrio.new(); break;
      default: rp.game=Troca.new(task);
    }
  },
  timeCost(){ return (G.upg.ferr?26:35)-(G.staff.tec?6:0); },
  finishTask(score){
    const rp=G.rep; if(!rp) return;
    const task=rp.tasks[rp.i];
    task.done=true;task.score=score;
    SFX.ok();Parts.add(W/2,H/2,20,"#8fe08a",80,.8);
    rp.i++;
    if(rp.i>=rp.tasks.length){Rep.finish();}
    else Rep.buildGame();
  },
  finish(){
    const rp=G.rep; if(!rp) return;
    const r=robRT(rp.rid);
    const partsNeeded=rp.tasks.filter(t=>compById(t.comp).task==="troca").map(t=>t.comp);
    partsNeeded.forEach(p=>{if((G.parts[p]||0)>0)G.parts[p]--;});
    const scores=rp.tasks.map(t=>t.score);
    const media=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);
    r.falhas=[];r.diag=false;
    r.saude=clamp(r.saude+16+scores.length*6,0,100);
    r.qual=clamp(Math.round(r.qual*.3+media*.7),0,100);
    r.estresse=clamp(r.estresse-10,0,100);
    G.min+=Rep.timeCost()*scores.length;
    G.stat.reparos+=scores.length;
    ach("a1"); if(G.stat.reparos>=10) ach("a2"); if(media>=98) ach("a3");
    if(media>=90) Story.unlock("l4");
    G.rep=null;G.scene="day";
    setSceneUI("day");
    UIResults.repair(r,media);
    checkAchGlobal();SaveManager.save();
  },
  abort(){
    if(!G.rep) return;
    G.rep=null;G.scene="day";
    setSceneUI("day");UI.hud();
    UI.toast("Reparo interrompido. As falhas continuam.","bad");
  }
};

const MG={ area:{x:150,y:34,w:310,h:196} };
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}

function ScrewsMake(n){
  const A=MG.area,arr=[];
  for(let i=0;i<n;i++){
    arr.push({x:A.x+40+((i%2)?A.w-80:0)+rnd(-8,8),y:A.y+36+Math.floor(i/2)*(A.h-72)+rnd(-6,6),rot:0,off:false});
  }
  return {arr,
    update(dt,pDown,p){
      if(pDown&&p){
        this.arr.forEach(s=>{
          if(!s.off&&Math.hypot(p.x-s.x,p.y-s.y)<18){s.rot+=dt*1.7;if(Math.random()<.2)SFX.screw();}
        });
      }
      this.arr.forEach(s=>{if(!s.off&&s.rot>=1){s.off=true;Parts.add(s.x,s.y,8,"#ffd24e",60,.5);SFX.spark();}});
      return this.arr.every(s=>s.off);
    },
    draw(g){
      this.arr.forEach(s=>{
        g.fillStyle="#00000066";g.beginPath();g.arc(s.x,s.y,13,0,7);g.fill();
        if(!s.off){
          g.save();g.translate(s.x,s.y);g.rotate(s.rot*6);
          g.fillStyle="#8b8f96";g.beginPath();g.arc(0,0,10,0,7);g.fill();
          g.strokeStyle="#3a3f46";g.lineWidth=3;
          g.beginPath();g.moveTo(-7,0);g.lineTo(7,0);g.moveTo(0,-7);g.lineTo(0,7);g.stroke();
          g.restore();
          g.strokeStyle="#ffb454";g.lineWidth=2;
          g.beginPath();g.arc(s.x,s.y,14,-Math.PI/2,-Math.PI/2+s.rot*Math.PI*2);g.stroke();
        }else{
          g.fillStyle="#2a241e";g.beginPath();g.arc(s.x,s.y,8,0,7);g.fill();
        }
      });
    }
  };
}

const ROOMS=[{id:1,nome:"PALCO"},{id:2,nome:"SALÃO"},{id:3,nome:"COZINHA"},{id:4,nome:"CORREDOR"},{id:5,nome:"DEPÓSITO"}];

function nightClock(){
  const n=G.night;if(!n) return "00:00";

const Night={
  start(){
    G.scene="night";
    const cap=Math.max(30,100+(G.upg.gerador?40:0)+(G.evento&&G.evento.cap||0));
    G.night={t:0,dur:Math.min(200,120+G.day*4),energia:cap,cap,porta:false,luz:false,
      cam:0,disj:true,blackout:false,pane:null,downRobo:null,escondido:false,hideT:0,noise:0,
      cdDesl:0,isca:G.upg.som?1:0,tripT:rnd(18,30),tripCount:0,fixP:0,sombraT:0};
    heartbeat(false);
    startAmbient("night");
    setSceneUI("night");
    renderNightBar();
    // Mini-tutorial na primeira noite
    if(G.stat.noites===0){ NightTut.start(); }
    else { NightTut.active=false; UI.toast("🌙 Turno da noite iniciado. Vigie as câmeras."); }
  },
  pickPane(){
    const cands=G.robots.filter(r=>r.unlocked&&r.saude>0);
    if(!cands.length) return null;
    let best=null,bw=-1;
    cands.forEach(r=>{
      const d=robDef(r.id);
      let risco=(1-d.conf)*.5+(100-r.saude)/100*.4+r.estresse/100*.3+G.day*.008;
      if(G.staff.seg) risco*=.75;
      if(Math.random()<risco&&risco>bw){bw=risco;best=r;}
    });
    return best;
  },
  update(dt){
    const n=G.night;if(!n) return;
    n.t+=dt;
    if(n.t>=n.dur){Night.end();return;}
    let drain=.32*(G.upg.gerador?.75:1);
    if(n.cam>0) drain+=.22;
    if(n.porta) drain+=1.1*(G.upg.segur?.5:1);
    if(n.luz) drain+=.45;
    if(!n.disj) drain*=1.6;
    n.energia=Math.max(0,n.energia-drain*dt);
    if(n.energia<=0&&!n.blackout){
      n.blackout=true;n.porta=false;n.disj=false;
      UI.toast("🌑 APAGÃO! Restaure o disjuntor!","bad");SFX.trip();
      Story.unlock("l5");
    }
    if(n.blackout&&n.disj&&n.energia>0) n.blackout=false;
    n.tripT-=dt;
    if(n.tripT<=0&&n.disj&&!n.blackout){
      n.disj=false;n.tripT=rnd(20,38)*(G.evento&&G.evento.trip?.55:1);
      n.tripCount++;SFX.trip();UI.toast("⚡ Um disjuntor caiu! Segure o botão ⚡ DISJUNTOR.","bad");renderNightBar();
    }
    n.cdDesl=Math.max(0,n.cdDesl-dt);
    // sombra do depósito (ambientação)
    n.sombraT=Math.max(0,n.sombraT-dt);
    if(!n.sombraT&&Math.random()<dt*.02) n.sombraT=1.2;
    // pane
    if(!n.pane&&!n.escondido&&Math.random()<dt*.05*(1+G.day*.06)){
      const r=Night.pickPane();
      if(r){
        n.pane={rid:r.id,idx:0,moveT:rnd(7,11),door:false,doorT:0};
        r.agress=clamp(r.agress+ri(10,25),0,100);
        UI.toast(`⚠ Ruído estranho vindo do palco...`,"bad");
        tone(140,.6,"sine",.15,-60);
      }
    }
    if(n.pane&&!n.escondido){
      const p=n.pane,rt=robRT(p.rid);
      const cur=paneRoom(p);
      const speed=(n.blackout?1.6:1)*(n.luz&&cur===4?.6:1);
      if(!p.door){
        p.moveT-=dt*speed;
        if(p.moveT<=0){
          p.idx++;p.moveT=rnd(7,11);
          if(p.idx>=PATH.length){
            p.door=true;p.doorT=8;heartbeat(true);SFX.alarm();
            UI.toast("💥 ALGO ESTÁ NA PORTA DO ESCRITÓRIO!","bad");
          }else{
            SFX.foot(clamp((p.idx+1)/3,.35,1));
            UI.toast(`👣 Passos metálicos: ${roomName(PATH[p.idx])}`,"bad");
          }
        }
      }else{
        if(n.porta){
          p.doorT-=dt;
          if(Math.random()<dt*.7){SFX.door();Parts.add(398,150,6,"#8b8f96",60,.4);}
          if(p.doorT<=0){
            UI.toast(`😮‍💨 ${robDef(p.rid).nome} desistiu e voltou ao salão.`,"good");
            rt.estresse=clamp(rt.estresse+8,0,100);
            n.pane=null;heartbeat(false);
          }
        }else{
          p.doorT+=dt;
          if(p.doorT>4){ Night.scare(rt); }
        }
      }
    }
    if(n.escondido){
      n.hideT-=dt;
      if(n.hideT<=0){
        n.escondido=false;
        UI.toast("🤫 ...foi embora. Por pouco.","good");
        if(n.pane){const rt=robRT(n.pane.rid);rt.estresse=clamp(rt.estresse+15,0,100);}
        n.pane=null;heartbeat(false);G.stat.escondidas++;ach("a5");Story.unlock("l7");
      }
    }
    if(n.pane&&n.pane.door) heartbeat(true); else if(!n.pane) heartbeat(false);
    Parts.update(dt);
  },
  hide(){
    const n=G.night;
    if(!n) return;
    if(n.escondido) return;
    if(!n.pane||!n.pane.door){ UI.toast("🚿 Não há ameaça para se esconder agora. Use quando algo estiver na porta.",""); return; }
    n.escondido=true;n.hideT=6;n.porta=false;
    SFX.hide();UI.toast("🚪 Você se tranca no armário. NÃO FAÇA BARULHO.","bad");
  },
  scare(rt){
    const n=G.night;n.pane=null;heartbeat(false);
    G.scare={t:1.4,rid:rt.id};
    SFX.scare();shake=6;
    const franquia=350;
    G.money-=franquia;G.sat=clamp(G.sat-15,0,100);G.pop=clamp(G.pop-6,0,100);
    rt.saude=clamp(rt.saude-30,0,100);rt.estresse=clamp(rt.estresse+40,0,100);rt.agress=clamp(rt.agress+20,0,100);
    rt.falhas.push(pick(robDef(rt.id).falhas));rt.falhas=[...new Set(rt.falhas)];
    G.stat.sustos++;
    UI.toast(`💥 INCIDENTE! ${robDef(rt.id).nome} invadiu o escritório. Seguro: −${fmt(franquia)}`,"bad");
  },
  desligar(){
    const n=G.night;
    if(!n) return;
    if(!n.pane){ UI.toast("🔌 Nenhum robô em pane no momento.",""); return; }
    if(n.cdDesl>0){ UI.toast(`🔌 Comando recarregando (${Math.ceil(n.cdDesl)}s).`,""); return; }
    if(n.blackout){ UI.toast("🔌 Sem energia para o comando remoto.","bad"); return; }
    if(n.pane.door||paneRoom(n.pane)!==n.cam){ UI.toast("📷 Encontre o robô em pane na câmera atual e tente de novo.","bad"); return; }
    n.energia=Math.max(0,n.energia-15);n.cdDesl=8;
    const rt=robRT(n.pane.rid),d=robDef(n.pane.rid);
    const p=.45+d.conf*.35+(G.upg.camhd?.15:0)-rt.agress/100*.2;
    if(Math.random()<p){
      UI.toast(`🔌 ${d.nome} desligado remotamente. Amanhã precisa de revisão.`,"good");
      rt.saude=clamp(rt.saude-10,0,100);
      n.downRobo={rid:n.pane.rid,room:paneRoom(n.pane)};
      n.pane=null;SFX.ok();heartbeat(false);
    }else{
      UI.toast(`❌ Falha no comando! ${d.nome} acelerou!`,"bad");
      if(!n.pane.door){ n.pane.idx=Math.min(PATH.length-1,n.pane.idx+1); n.pane.moveT=4; }
      SFX.err();
    }
  },
  isca(){
    const n=G.night;
    if(!n) return;
    if(!G.upg.som) return;
    if(!n.isca){ UI.toast("🎵 A isca sonora já foi usada esta noite.",""); return; }
    if(!n.pane||n.pane.door){ UI.toast("🎵 Nada para atrair agora.",""); return; }
    n.isca=0;n.energia=Math.max(0,n.energia-10);
    n.pane.idx=0;n.pane.moveT=rnd(8,12);
    UI.toast("🎵 A isca sonora tocou uma valsa. Os passos recuaram...","good");
    ach("a12");tone(523,.2,"triangle",.15);setTimeout(()=>tone(659,.25,"triangle",.15),200);
    renderNightBar();
  },
  end(){
    if(G.night&&G.night.energia<=0){ G.stat.apagoes++; ach("a4"); }
    heartbeat(false);G.night=null;G.scare=null;
    NightTut.active=false;$("nightTutCard").classList.add("hidden");
    UIResults.night();
  }
};

/* Segurar para restaurar o disjuntor — botão ⚡ OU metade de baixo do canvas */
const Input={down:false,p:null,upPos:null,disjHold:false,
  canvasPos(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};},
};
function handleBreakerHold(dt){
  const n=G.night;if(!n||n.escondido) return;
  if(n.disj){ Input.disjHold=false; return; }
  const holding=Input.disjHold||(Input.down&&Input.p&&Input.p.y>H*.55);
  const dj=$("nbDisj");
  if(holding){
    n.fixP=(n.fixP||0)+dt;
    if(Math.random()<.2) Parts.add(rnd(W*.4,W*.6),rnd(H*.6,H*.85),2,"#ffd24e",50,.4);
    if(dj) dj.innerHTML=`⚡ <span class="lbl">${Math.min(99,Math.floor(n.fixP/2.5*100))}%...</span>`;
    if(n.fixP>=2.5){
      n.disj=true;n.fixP=0;
      if(n.energia>0)n.blackout=false;
      SFX.ok();UI.toast("✅ Disjuntor restaurado.","good");
      renderNightBar();
      NightTut.notify("disj");
    }
  }else{
    n.fixP=Math.max(0,(n.fixP||0)-dt*2);
  }
}

/* ---------------- RENDER ---------------- */
const cv=$("cv"),ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
let shake=0,glitch=0;

function fit(){
  const stage=$("stage");
  const aw=stage.clientWidth,ah=stage.clientHeight;
  if(aw<=0||ah<=0) return;
  const s=Math.min(aw/W,ah/H);
  cv.style.width=Math.max(1,Math.floor(W*s))+"px";
  cv.style.height=Math.max(1,Math.floor(H*s))+"px";
}
let fitRaf=null;
function fitSoon(){ if(fitRaf) return; fitRaf=requestAnimationFrame(()=>{fitRaf=null;fit();}); }
window.addEventListener("resize",fitSoon);
window.addEventListener("orientationchange",()=>setTimeout(fitSoon,120));
if(window.visualViewport) window.visualViewport.addEventListener("resize",fitSoon);

function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w,h);}
function glow(x,y,r,c){
  const g=ctx.createRadialGradient(x,y,2,x,y,r);
  g.addColorStop(0,c);g.addColorStop(1,"transparent");
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function glowLocal(g,x,y,r,c){const gr=g.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,"transparent");g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);}

function drawRobo(g,r,cx,fy,s,t,o={}){
  const d=robDef(r.id),c=d.cores,off=o.mode==="off",evil=o.mode==="evil",show=o.mode==="show",broken=o.mode==="broken";
  const bob=off?0:Math.sin(t*(show?5:2.2)+r.fase)*(show?2.4:1.2);
  g.save();g.translate(cx|0,(fy+bob)|0);
  const R=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect((x*s)|0,(y*s)|0,Math.max(1,w*s|0),Math.max(1,h*s|0));};
  R(-7,-8,4,8,shade(c.p,-30));R(3,-8,4,8,shade(c.p,-30));R(-8,-2,5,2,c.d);R(3,-2,5,2,c.d);
  R(-9,-22,18,15,c.p);R(-6,-19,12,9,c.s);R(-2,-13,4,2,c.d);
  const aa=show?Math.sin(t*6+r.fase)*.9:Math.sin(t*2+r.fase)*.15;
  g.save();g.translate(-9*s,-20*s);g.rotate(-.4-aa);R(0,0,3,10,shade(c.p,-15));R(0,10,3,3,c.d);g.restore();
  g.save();g.translate(9*s,-20*s);g.rotate(.4+aa);R(-3,0,3,10,shade(c.p,-15));R(-3,10,3,3,c.d);g.restore();
  R(-8,-34,16,12,c.p);R(-6,-32,12,8,shade(c.p,14));
  const blink=(!off&&!evil)&&(Math.sin(t*.7+r.fase*3)>.97);
  const eyeC=evil?"#ff3b30":off?"#2a2a2a":broken?"#7a6a52":"#ffe9a8";
  if(!blink){R(-5,-30,3,3,eyeC);R(2,-30,3,3,eyeC);}else{R(-5,-29,3,1,eyeC);R(2,-29,3,1,eyeC);}
  if(evil){g.globalAlpha=.5+.3*Math.sin(t*10);glowLocal(g,-3.5*s,-28.5*s,8,"#ff3b3055");glowLocal(g,3.5*s,-28.5*s,8,"#ff3b3055");g.globalAlpha=1;}
  R(-3,-25,6,2,broken?"#3a3025":c.d);
  switch(d.esp){
    case "urso": R(-9,-37,4,4,c.p);R(5,-37,4,4,c.p);R(-2,-27,4,3,c.s);R(-1,-26,2,1,c.d);R(-9,-22,18,3,"#ffffff33"); break;
    case "coelho": R(-7,-44,3,10,c.p);R(4,-44,3,10,c.p);R(-6,-42,1,6,c.s);R(5,-42,1,6,c.s);R(-2,-38,4,3,"#d8dee6"); break;
    case "raposa": R(-9,-38,4,4,c.p);R(5,-38,4,4,c.p);R(9,-20,3,10,shade(c.p,-20));R(-9,-22,3,12,"#7c2c22"); break;
    case "coruja": R(-11,-21,3,10,shade(c.p,-20));R(8,-21,3,10,shade(c.p,-20));R(-6,-36,5,5,"#ffffff33");R(1,-36,5,5,"#ffffff33");R(-1,-37,2,3,c.d); break;
    case "macaco": R(-10,-32,3,5,c.p);R(7,-32,3,5,c.p);R(-1,-40,2,6,c.d);if(!off&&Math.random()<.06)Parts.add(cx,fy-40*s,2,"#ffd24e",30,.3); break;
    case "dragao": R(-6,-38,3,4,c.s);R(3,-38,3,4,c.s);R(6,-26,5,3,shade(c.p,-20));if(show&&Math.random()<.15)Parts.add(cx+8*s,fy-26*s,1,"#ffb08a",20,.5,-20); break;
    case "gata": R(-8,-38,4,4,c.p);R(4,-38,4,4,c.p);R(10,-16,6,1,"#dfe6ec");R(11,-15,4,1,"#dfe6ec"); break;
    case "pinguim": R(-8,-37,16,3,c.d);R(-9,-34,3,8,c.d);R(6,-34,3,8,c.d);R(-5,-14,10,4,"#111418");R(-3,-13,3,2,"#8fe08a"); break;
    case "sapo": R(-8,-39,5,5,c.p);R(3,-39,5,5,c.p);R(-7,-38,3,3,eyeC);R(4,-38,3,3,eyeC);R(-4,-44,8,5,"#245c38");R(-1,-40,2,1,"#ffd24e"); break;
    case "robomesa": R(-9,-36,18,14,"#9aa3ad");R(-6,-33,12,4,"#0f1318");R(-5,-32,10,2,evil?"#ff3b30":"#7fd4d0");R(-2,-23,4,2,"#c33b1f");R(-8,-4,16,4,"#22262b"); break;
    case "tartaruga": R(-12,-24,5,12,"#3e5a3a");R(7,-24,5,12,"#3e5a3a");R(-7,-31,5,3,"#cfe3b8");R(2,-31,5,3,"#cfe3b8"); break;
    case "abelha": R(-9,-20,18,2,c.s);R(-9,-15,18,2,c.s);R(-11,-30,3,8,"#ffffff55");R(8,-30,3,8,"#ffffff55");R(-2,-40,4,4,off?"#555":"#fff0a8");if(!off)glowLocal(g,0,-38*s,10,"#fff0a833"); break;
  }
  if(broken&&Math.random()<.08) Parts.add(cx+rnd(-8,8)*s,fy-rnd(10,30)*s,2,"#ffd24e",40,.3);
  g.restore();
}

  else px(0,0,W,H,"#0d0a09");

    G.scare.t-=1/60;

    glitch=1;
    if(G.scare.t<=0)G.scare=null;
  }
  if(glitch>0){
    for(let i=0;i<4;i++){
      const y=rnd(0,H)|0,h=Math.min(H-y,rnd(2,10)|0);

  }
  ctx.restore();
  if(G&&G.scene==="night") renderNightTop();
}

    ${n.cdDesl>0?`<div class="stat">🔌 ${Math.ceil(n.cdDesl)}s</div>`:""}

  else if(n.pane) msg=`movimento detectado: ${roomName(paneRoom(n.pane))}`;

}

      </div>
    </div>

      <div id="dgBody" style="margin-top:6px"></div>
    </div>
    <div class="row" id="rbtns" style="margin-top:8px"></div>
  `);
  const dg=w.querySelector("#dgBody"),btns=w.querySelector("#rbtns");
  function paintDg(){
    if(r.falhas.length===0){dg.innerHTML=`<span class="tag ok">NENHUMA FALHA — pronto para o palco 🎶</span>`;}
    else if(r.diag){
      dg.innerHTML=r.falhas.map(f=>{
        const c=compById(f),need=c.task==="troca";
        const have=(G.parts[f]||0)>0;
        return `<div class="row" style="margin-bottom:4px"><span class="tag bad">${c.ico} ${c.nome}</span>
          ${need?`<span class="tag ${have?"ok":"warn"}">${have?"peça em estoque ✓":"precisa comprar"}</span>`:""}
        </div>`;
      }).join("");
    }else{
      dg.innerHTML=`<span class="tag warn">RANGIDOS E RUÍDOS SUSPEITOS (${r.falhas.length} fonte${r.falhas.length>1?"s":""})</span>`;
    }
    btns.innerHTML="";

      btns.appendChild(mkBtn(`🔍 DIAGNOSTICAR ${G.upg.scanner?"(grátis)":"(CR$ 40 · 10 min)"}`,"primary",()=>{

        r.diag=true;SFX.ok();paintDg();UI.hud();

    }else if(r.falhas.length&&r.diag){
      const falta=r.falhas.some(f=>compById(f).task==="troca"&&!(G.parts[f]>0));
      if(falta){
        btns.appendChild(mkBtn("🛒 IR À LOJA DE PEÇAS","",()=>{w.remove();openDrawer("loja");}));

        for(const f of r.falhas){
          const c=compById(f);
          if(c.task==="troca"&&!(G.parts[f]>0)){UI.toast(`Falta a peça: ${c.nome}.`,"bad");return;}
        }
        w.remove();Rep.start(r);
      }));
    }else{
      btns.appendChild(mkBtn("🎬 TESTAR DESEMPENHO","",()=>{
        w.remove();G.min+=10;
        if(r.qual<60&&Math.random()<.25){
          const nf=pick(d.falhas);
          if(!r.falhas.includes(nf)){r.falhas.push(nf);UI.toast(`⚠ O teste revelou uma solda fria (${compById(nf).nome})!`,"bad");SFX.err();}
          else UI.toast("🎬 Teste concluído. "+d.nome+" dança, mas range.","");
        }else{
          UI.toast(`🎬 ${d.nome} faz uma pirueta perfeita! (${d.musica} tocando)`,"good");SFX.ok();
        }
        UI.hud();
      }));
    }
    btns.appendChild(mkBtn("FECHAR","",()=>w.remove()));
  }
  paintDg();
}
function mkBtn(txt,cls,fn){
  const b=document.createElement("button");b.className="btn "+(cls||"");b.innerHTML=txt;
  b.onclick=()=>{SFX.click();fn();};return b;
}

function openDrawer(tab){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.tab===tab));
  $("drawer").classList.remove("hidden");
  const body=$("drawerBody");body.innerHTML="";
  const close=document.createElement("button");close.className="closeX";close.textContent="✕";
  close.onclick=()=>{$("drawer").classList.add("hidden");document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));SFX.click();};
  const title=$("drawerTitle");title.innerHTML="";
  const names={oficina:"🔧 Oficina & Peças",loja:"🛒 Loja",equipe:"⚙ Equipe & Melhorias",contratos:"📋 Contratos",arquivos:"📼 Arquivos da Estação"};
  title.appendChild(document.createTextNode(names[tab]));title.appendChild(close);
  if(tab==="oficina") drawerOficina(body);
  if(tab==="loja") drawerLoja(body);
  if(tab==="equipe") drawerEquipe(body);
  if(tab==="contratos") drawerContratos(body);
  if(tab==="arquivos") drawerArquivos(body);
}
function drawerOficina(body){
  const inv=Object.entries(G.parts).filter(([k,v])=>v>0);
  const total=Object.values(G.parts).reduce((a,b)=>a+b,0);
  body.innerHTML=`<div class="chip" style="margin-bottom:8px">📦 Estoque: <b>${total}/${G.upg.estoque?40:G.partsCap}</b>
    ${inv.length? " — "+inv.map(([k,v])=>`${compById(k).ico}×${v}`).join(" · "):" (vazio)"}</div>
    <p style="color:var(--dim);margin-bottom:8px">Selecione um robô na lista à esquerda (toque duplo para inspecionar). Conserte as falhas antes de abrir o salão.</p>`;
  G.robots.filter(r=>r.unlocked).forEach(r=>{
    const d=robDef(r.id);
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<div class="row"><h3>${d.nome}</h3><small style="margin-left:auto">${d.cargo}</small></div>
      <div class="row" style="margin-top:4px">
        <span class="tag ${r.falhas.length?"bad":"ok"}">${r.falhas.length?r.falhas.length+" FALHA(S)":"SEM FALHAS"}</span>
        <span class="tag">SAÚDE ${Math.round(r.saude)}</span><span class="tag">QUAL ${Math.round(r.qual)}</span>
      </div>`;
    c.onclick=()=>openRobot(r.id);
    body.appendChild(c);
  });
  const locked=G.robots.filter(r=>!r.unlocked);
  if(locked.length){
    const h=document.createElement("h3");h.style.cssText="color:var(--amber);margin:10px 0 6px;letter-spacing:1px";
    h.textContent="📦 DEPÓSITO — ROBÔS PARA ATIVAR";body.appendChild(h);
    locked.forEach(r=>{
      const d=robDef(r.id);
      const c=document.createElement("div");c.className="card";
      c.innerHTML=`<div class="row"><h3>${d.nome}</h3><small style="margin-left:auto">${d.musica}</small></div>
        <div class="row" style="margin-top:6px"><button class="btn small primary">ATIVAR — ${fmt(d.custo)}</button></div>`;
      c.querySelector("button").onclick=()=>{
        if(G.money<d.custo){UI.toast("Créditos insuficientes.","bad");return;}
        G.money-=d.custo;r.unlocked=true;r.saude=ri(50,70);r.falhas=[pick(d.falhas)];
        SFX.cash();UI.toast(`🎉 ${d.nome} chegou! (${d.musica})`,"good");
        checkAchGlobal();renderRoboList();UI.hud();SaveManager.save();openDrawer("oficina");
      };
      body.appendChild(c);
    });
  }
}
function drawerLoja(body){
  const promo=G.evento&&G.evento.promo?G.evento.promo:1;
  const desc=G.upg.estoque?.9:1;
  const total=Object.values(G.parts).reduce((a,b)=>a+b,0);
  const cap=G.upg.estoque?40:G.partsCap;
  body.innerHTML=`<div class="chip" style="margin-bottom:8px">📦 Estoque ${total}/${cap} ${promo<1?"· <b style='color:var(--green)'>PROMOÇÃO −30% HOJE!</b>":""}</div>`;
  COMP.forEach(c=>{
    const preco=Math.round(c.preco*promo*desc);
    const row=document.createElement("div");row.className="card";
    row.innerHTML=`<div class="row"><b style="color:var(--amber)">${c.ico}</b><h3>${c.nome}</h3>
      <span class="tag">uso: ${c.task}</span>
      <button class="btn small primary" style="margin-left:auto">${fmt(preco)}</button></div>`;
    row.querySelector("button").onclick=()=>{
      const tot=Object.values(G.parts).reduce((a,b)=>a+b,0);
      if(tot>=cap){UI.toast("Estoque cheio! Compre Estoque Ampliado.","bad");return;}
      if(G.money<preco){UI.toast("Créditos insuficientes.","bad");return;}
      G.money-=preco;G.parts[c.id]=(G.parts[c.id]||0)+1;G.min+=5;
      SFX.cash();UI.hud();
      row.querySelector(".tag").textContent=`em estoque: ${G.parts[c.id]}`;
      SaveManager.save();
    };
    if((G.parts[c.id]||0)>0) row.querySelector(".tag").textContent=`em estoque: ${G.parts[c.id]}`;
    body.appendChild(row);
  });
}
function drawerEquipe(body){
  const h1=document.createElement("h3");h1.style.cssText="color:var(--amber);margin-bottom:6px;letter-spacing:1px";h1.textContent="MELHORIAS DA OFICINA";body.appendChild(h1);
  UPG.forEach(u=>{
    const owned=G.upg[u.id];
    const c=document.createElement("div");c.className="card"+(owned?" sel":"");
    c.innerHTML=`<div class="row"><h3>${u.nome}</h3>${owned?'<span class="tag ok" style="margin-left:auto">INSTALADA ✓</span>':`<button class="btn small primary" style="margin-left:auto">${fmt(u.custo)}</button>`}</div>
      <small style="color:var(--dim)">${u.desc}</small>`;
    if(!owned){
      c.querySelector("button").onclick=()=>{
        if(G.money<u.custo){UI.toast("Créditos insuficientes.","bad");return;}
        G.money-=u.custo;G.upg[u.id]=1;SFX.cash();
        UI.toast(`⚙ Melhoria instalada: <b>${u.nome}</b>`,"good");
        if(u.id==="camhd")Story.unlock("l6");
        if(u.id==="som")Story.unlock("l10");
        checkAchGlobal();SaveManager.save();openDrawer("equipe");
      };
    }
    body.appendChild(c);
  });
  const h2=document.createElement("h3");h2.style.cssText="color:var(--amber);margin:10px 0 6px;letter-spacing:1px";h2.textContent="EQUIPE CONTRATADA";body.appendChild(h2);
  STAFF.forEach(s=>{
    const on=G.staff[s.id];
    const c=document.createElement("div");c.className="card"+(on?" sel":"");
    c.innerHTML=`<div class="row"><h3>${s.nome}</h3>
      <button class="btn small ${on?"danger":"green"}" style="margin-left:auto">${on?"DEMITIR":"CONTRATAR"}</button></div>
      <small style="color:var(--dim)">${s.desc} · salário ${fmt(s.sal)}/noite</small>`;
    c.querySelector("button").onclick=()=>{
      G.staff[s.id]=!G.staff[s.id];SFX.click();SaveManager.save();openDrawer("equipe");
      UI.toast(G.staff[s.id]?`🤝 ${s.nome} entrou para a equipe!`:`👋 ${s.nome} deixou a equipe.`);
    };
    body.appendChild(c);
  });
}
function drawerContratos(body){
  body.innerHTML=`<div class="chip" style="margin-bottom:8px">Ativos: <b>${G.ativos.length}/2</b> · avaliados no fim da noite.</div>`;
  const h=document.createElement("h3");h.style.cssText="color:var(--amber);margin-bottom:6px";h.textContent="OFERTAS DE HOJE";body.appendChild(h);
  if(!G.contratos.length) body.innerHTML+=`<p style="color:var(--dim)">Nenhuma oferta hoje. Volte amanhã.</p>`;
  G.contratos.forEach((c,i)=>{
    const d=document.createElement("div");d.className="card";
    d.innerHTML=`<div class="row"><h3>${c.nome}</h3><b style="margin-left:auto;color:var(--yellow)">${fmt(c.pag)}</b></div>
      <small style="color:var(--dim)">${c.desc}</small>
      <div class="row" style="margin-top:6px"><button class="btn small primary">ACEITAR</button></div>`;
    d.querySelector("button").onclick=()=>{
      if(G.ativos.length>=2){UI.toast("Máximo de 2 contratos ativos.","bad");return;}
      G.ativos.push(c);G.contratos.splice(i,1);SFX.ok();openDrawer("contratos");
    };
    body.appendChild(d);
  });
  if(G.ativos.length){
    const h2=document.createElement("h3");h2.style.cssText="color:var(--amber);margin:10px 0 6px";h2.textContent="CONTRATOS ATIVOS";body.appendChild(h2);
    G.ativos.forEach(c=>{
      const d=document.createElement("div");d.className="card sel";
      d.innerHTML=`<div class="row"><h3>${c.nome}</h3><b style="margin-left:auto;color:var(--yellow)">${fmt(c.pag)}</b></div>
        <small style="color:var(--dim)">${c.desc}</small>`;
      body.appendChild(d);
    });
  }
}
function drawerArquivos(body){
  body.innerHTML=`<p style="color:var(--dim);margin-bottom:8px">Gravações, relatórios e segredos da Estação. <b>${G.logs.length}/${LOGS.length}</b> descobertos.</p>`;
  LOGS.forEach(l=>{
    const has=G.logs.includes(l.id);
    const c=document.createElement("div");c.className="card";
    if(has){
      c.innerHTML=`<div class="row"><h3>📼 ${l.titulo}</h3><small style="margin-left:auto;color:var(--dim)">${l.cond}</small></div>
        <div class="logTxt">${l.txt}</div>`;
    }else{
      c.innerHTML=`<div class="row"><h3 style="color:var(--dim)">📼 ???</h3><small style="margin-left:auto;color:var(--dim)">pista: ${l.cond}</small></div>`;
    }
    body.appendChild(c);
  });
  const h=document.createElement("h3");h.style.cssText="color:var(--amber);margin:10px 0 6px";h.textContent="ESTATÍSTICAS DO TURNO";body.appendChild(h);
  body.innerHTML+=`<div class="card"><div class="grid2">
    <div>🔧 Reparos: <b>${G.stat.reparos}</b></div><div>🌙 Noites: <b>${G.stat.noites}</b></div>
    <div>💥 Sustos: <b>${G.stat.sustos}</b></div><div>🚿 Esconderijas: <b>${G.stat.escondidas}</b></div>
    <div>🌑 Apagões: <b>${G.stat.apagoes}</b></div><div>💰 Ganhos: <b>${fmt(G.stat.ganho)}</b></div>
  </div></div>`;
}

function openSettings(){
  const w=UI.modal(`<h2>⚙ Configurações</h2>
    <div class="card"><div class="row">🔊 Volume <input type="range" id="setVol" min="0" max="100" value="${Math.round(AU.vol*100)}"></div></div>
    <div class="card"><div class="row">📳 Tremor de tela
      <button class="btn small ${G.settings.shake?"green":""}" id="setShake">${G.settings.shake?"LIGADO":"DESLIGADO"}</button></div></div>
    <div class="row" style="margin-top:8px">
      <button class="btn" id="setTut">ℹ TUTORIAL</button>
      <button class="btn danger" id="setWipe">🗑 APAGAR</button>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="setOk">FECHAR</button></div>`);
  w.querySelector("#setVol").oninput=e=>{AU.vol=e.target.value/100;if(AU.master)AU.master.gain.value=AU.vol;G.settings.vol=AU.vol;SaveManager.save();};
  w.querySelector("#setShake").onclick=()=>{G.settings.shake=!G.settings.shake;w.remove();openSettings();};
  w.querySelector("#setTut").onclick=()=>{w.remove();Tutorial.start();};
  w.querySelector("#setWipe").onclick=()=>{if(confirm("Apagar todo o progresso?")){SaveManager.wipe();location.reload();}};
  w.querySelector("#setOk").onclick=()=>w.remove();
}
function openAch(){
  const w=UI.modal(`<h2>🏆 Conquistas</h2>
    ${ACHS.map(a=>`<div class="card ${G.ach[a.id]?"sel":""}"><div class="row">
      <h3>${G.ach[a.id]?"✅":"⬜"} ${a.nome}</h3></div><small style="color:var(--dim)">${a.desc}</small></div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="btn primary" id="achOk">FECHAR</button></div>`);
  w.querySelector("#achOk").onclick=()=>w.remove();
}

const Tutorial={
  steps:[
    {t:"🔩 Bem-vindo(a) à Estação Faísca!",p:"Você herdou esta cantina de robôs cantores. De dia: conserte, compre peças e prepare o elenco. De noite: sirva mesas, fature... e vigie."},
    {t:"🔧 Oficina",p:"Toque num robô na lista à esquerda (toque duplo) para inspecioná-lo. DIAGNOSTIQUE falhas, compre peças na LOJA e INICIE O REPARO com os minigames."},
    {t:"⏰ O relógio corre",p:"Cada ação consome tempo do dia. Quando estiver pronto, toque em ▶ ABRIR O SALÃO para começar o turno da noite. Na primeira noite há um treinamento especial!"},
    {t:"📼 E tem mais...",p:"A Estação guarda segredos do tio Heitor. Encontre gravações na aba ARQUIVOS. Mantenha a música tocando. Boa sorte!"},
  ],
  i:0,
  start(){ this.i=0;this.show(); },
  show(){
    const s=this.steps[this.i];
    $("tut").classList.remove("hidden");
    $("tut").innerHTML=`<div class="panel" id="tutCard">
      <h2 style="color:var(--amber)">${s.t}</h2>
      <p>${s.p}</p>
      <div class="row"><button class="btn primary" id="tutNext">${this.i<this.steps.length-1?"PRÓXIMO ▶":"COMEÇAR! 🔧"}</button>
      <button class="btn" id="tutSkip">PULAR</button></div></div>`;
    $("tutNext").onclick=()=>{SFX.click();this.i++;if(this.i>=this.steps.length)this.end();else this.show();};
    $("tutSkip").onclick=()=>{SFX.click();this.end();};
  },
  end(){$("tut").classList.add("hidden");SaveManager.save();}
};

/* ---------------- LOOP ---------------- */
function update(dt){
  RT+=dt;
  shake=Math.max(0,shake-dt*8);
  if(!G) { drawTitleBot(RT); return; }
  Parts.update(dt);

  // reparo: atualiza minigame e detecta conclusão
  if(G.scene==="repair"&&G.rep&&G.rep.game){
    G.rep.t+=dt;
    const done=G.rep.game.update(dt,Input.down,Input.p);
    if(done){
      const par=G.rep.game.par||12;
      const score=clamp(Math.round(100-Math.max(0,G.rep.t-par)*4-G.rep.err*6),45,100);
      Rep.finishTask(score);
    }
  }

  if(G.scene==="night"){
    const n=G.night;
    if(n){
      if(NightTut.active){
        // tempo congelado durante o tutorial, mas o disjuntor de treino funciona
        handleBreakerHold(dt);
      }else{
        handleBreakerHold(dt);
        Night.update(dt);
        if(n.escondido&&n.noise>0){
          n.noise=0;n.escondido=false;
          UI.toast("💥 Você fez barulho!","bad");
          if(n.pane)Night.scare(robRT(n.pane.rid));
        }
      }
    }
  }
  if(G.scene==="day"&&G.min>=840){
    UI.toast("🌙 Já é tarde. O salão abre agora...","bad");
    Night.start();
  }
  UI.hud();
}
function drawTitleBot(t){
  const c=$("cvTitle").getContext("2d");
  c.clearRect(0,0,160,120);
  if(!G){
    c.fillStyle="#ffb454";c.fillRect(70,30,20,26);c.fillRect(74,18,12,12);
    c.fillStyle="#241302";c.fillRect(76,22,3,3);c.fillRect(81,22,3,3);
    c.fillStyle="#a5683c";c.fillRect(68,14,5,5);c.fillRect(87,14,5,5);
    return;
  }
  drawRobo(c,robRT(G.sel||"mel"),80,108,2.2,t,{mode:"show"});
}
let last=0;
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
  update(dt);render();
  requestAnimationFrame(frame);
}

/* ---------------- BOOT ---------------- */
function enterDay(){
  $("scrTitle").classList.add("hidden");
  G.scene="day";
  setSceneUI("day");
  startAmbient("day");
  renderRoboList();UI.hud();
}
function wire(){
  document.querySelectorAll(".tab").forEach(b=>{ b.onclick=()=>{SFX.click();openDrawer(b.dataset.tab);}; });
  $("btnOpen").onclick=()=>{
    if(!G||G.scene!=="day") return;
    SFX.click();
    const broken=G.robots.filter(r=>r.unlocked&&r.falhas.length).length;
    if(broken>0&&!confirm(`${broken} robô(s) com falhas vão ao palco mesmo assim (risco de pane). Abrir o salão?`)) return;
    $("drawer").classList.add("hidden");
    Night.start();
  };
  $("repExit").onclick=()=>{
    if(G&&G.scene==="repair"&&confirm("Abortar o reparo? As falhas não serão consertadas.")) Rep.abort();
  };
  $("btnSet").onclick=()=>{SFX.click();openSettings();};
  $("btnAch").onclick=()=>{SFX.click();openAch();};
  $("btnNew").onclick=()=>{
    auInit();SFX.click();
    newGame();SaveManager.save();
    enterDay();
    Tutorial.start();
    morningRoutine();
    UI.toast(G.evento&&G.evento.txt?G.evento.txt:"Bem-vindo(a) à Estação Faísca!","good");
  };
  $("btnCont").onclick=()=>{
    auInit();SFX.click();
    const d=SaveManager.load();
    if(!d){UI.toast("Nenhum save encontrado.","bad");return;}
    Serial.unpack(d);
    enterDay();
    UI.toast(`💾 Turno retomado: dia ${G.day}.`,"good");
  };
  $("btnCred").onclick=()=>{
    auInit();SFX.click();
    const w=UI.modal(`<h2>ℹ Sobre</h2>
      <p style="line-height:1.6"><b>ESTAÇÃO FAÍSCA</b> é um jogo original de gestão, reparo e horror leve.<br><br>
      Conserte os 12 robôs cantores, faça o restaurante prosperar e sobreviva aos turnos da noite — quando as máquinas danificadas começam a andar sozinhas.<br><br>
      Universo, personagens e história 100% originais. Feito com HTML5 Canvas e WebAudio.</p>
      <div class="row" style="margin-top:10px"><button class="btn primary" id="crOk">FECHAR</button></div>`);
    w.querySelector("#crOk").onclick=()=>w.remove();
  };
  window.addEventListener("pointerdown",()=>{auInit();AU.ctx&&AU.ctx.resume&&AU.ctx.resume();},{once:true});
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){ if(G&&!G.over&&G.scene==="day") SaveManager.save(); stopAmbient(); Input.disjHold=false; }
    else if(G&&G.scene) startAmbient(G.scene==="night"?"night":"day");
  });
  if(SaveManager.load()) $("btnCont").classList.add("primary"); else { $("btnCont").disabled=true; $("btnCont").style.opacity=.4; }
}
fit();wire();requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fitSoon);
</script>
